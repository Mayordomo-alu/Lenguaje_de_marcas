<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <div>
        <form action="http://172.30.18.224:3000/" enctype="multipart/form-data" method="post">
            <table>
                <caption>Formulario de alta de usuario</caption>
                <tr>
                    <td><label for="usuario">Identificador de nuevo usuario</label> <input type="text"
                            value="usu_012345" readonly name="usuario" id="usuario"></td>
                </tr>
                <tr>
                    <td><label for="nombre_completo">Nombre: </label><input type="text" name="nombre"
                            id="nombre_completo" title="Escribe tu nombre"></td>
                    <td><label for="nombre_completo">Apellidos: </label><input type="text" name="apellidos"
                            id="nombre_completo" title="Escribe tus dos apellidos"></td>
                </tr>
                <tr>
                    <td><label for="pass">Contraseña: </label><input type="password" name="password" id="pass"
                            title="La contraseña tiene que contener almenos un numero y letra"></td>
                    <td><label for="pass"></label> Confirmar contraseña: </label><input type="password" name="password2"
                            id="pass" title="Introduce de nuevo la contraseña"></td>
                </tr>
                <tr>
                    <td colspan="2"><label for="email">Email: </label><input type="text" name="email" id="email"
                            title="Introduce tu email"></td>
                </tr>
                <tr>
                    <td><label for="genero"></label> Sexo: </td>
                    <td><input type="radio" name="sexo" value="hombre" id="genero">Hombre <input type="radio"
                            name="sexo" value="mujer" id="genero" checked>Mujer</td>
                </tr>
                <tr>
                    <td rowspan="3"><label for="hobby">Aficiones: </label></td>
                    <td><input type="checkbox" name="aficiones" value="deporte" id="hobby">Deporte</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="aficiones" checked value="lectura" id="hobby">Lectura</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="aficiones" value="cine" id="hobby">Cine</td>
                </tr>
                <tr>
                    <td><label for="country">País: </label></td>
                    <td>
                        <select name="pais" id="country">
                            <option value="españa" selected>España</option>
                            <option value="francia">Francia</option>
                            <option value="portugal">Portugal</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="img">Subir su foto: </label></td>
                    <td><input type="file" name="foto" id="img"></td>
                </tr>
                <tr>
                    <td><label for="comentario">Comentarios personales</label></td>
                    <td><textarea name="comentarios" id="comentario" placeholder="Escriba aquí sus comentarios"
                            cols="40" rows="5"></textarea></td>
                </tr>
                <tr>
                    <td><input type="reset"></td>
                    <td><input type="submit"></td>
                </tr>


            </table>
        </form>
    </div>
</body>
